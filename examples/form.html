<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Form — Blau Example</title>
  <link rel="stylesheet" href="../styles/variables.css"/>
  <link rel="stylesheet" href="../styles/global.css"/>
  <style>
    body { padding: 4rem 2rem; max-width: 580px; margin: 0 auto; font-family: var(--font); }
    h1 { font-family: var(--font-title); font-size: 1.8rem; font-weight: 700; margin-bottom: .5rem; }
    .subtitle { font-size: .85rem; color: var(--mid); margin-bottom: 2.5rem; line-height: 1.7; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--light); margin-bottom: .5rem; }
    input, textarea {
      width: 100%; padding: .65rem .85rem; font-size: .85rem;
      border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-family: var(--font);
      transition: border-color .2s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--blue); }
    textarea { min-height: 120px; resize: vertical; }
    .tags { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 2rem; }
    .actions { display: flex; gap: .75rem; align-items: center; }
  </style>
</head>
<body>

  <span class="blau-tag">Example</span>
  <h1>Get in touch</h1>
  <p class="subtitle">This example shows form inputs styled with Blau tokens, combined with button and tag components.</p>

  <div class="tags">
    <span class="blau-tag--project">Collaboration</span>
    <span class="blau-tag--project">Freelance</span>
    <span class="blau-tag--project">Full-time</span>
  </div>

  <form onsubmit="return false;">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name"/>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell me about your project..."></textarea>
    </div>
    <div class="actions">
      <button class="blau-btn blau-btn--primary" type="submit">Send message</button>
      <button class="blau-btn" type="reset">Clear</button>
    </div>
  </form>

</body>
</html>
