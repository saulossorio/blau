<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tags / Labels — Blau Components</title>
  <link rel="stylesheet" href="../../styles/variables.css"/>
  <link rel="stylesheet" href="../../styles/global.css"/>
  <style>
    body { padding: 3rem; max-width: 640px; margin: 0 auto; }
    section { margin-bottom: 2.5rem; }
    h1 { font-family: var(--font-title); font-size: 1.4rem; margin-bottom: 2rem; }
    h2 { font-size: .65rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--light); margin-bottom: 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  </style>
</head>
<body>

  <h1>Tags &amp; Labels</h1>

  <section>
    <h2>Tag (generic label)</h2>
    <div class="row">
      <span class="blau-tag">Featured</span>
      <span class="blau-tag">New</span>
      <span class="blau-tag">v1.0</span>
    </div>
  </section>

  <section>
    <h2>Project type tag</h2>
    <div class="row">
      <span class="blau-tag--project">UI Design</span>
      <span class="blau-tag--project">Web</span>
      <span class="blau-tag--project">Motion</span>
    </div>
  </section>

  <section>
    <h2>Eyebrow (section marker)</h2>
    <div class="row">
      <span class="blau-eyebrow">Selected Work</span>
    </div>
  </section>

</body>
</html>
